[theme]
# Keep these in sync with PALETTE in web/theme.py — this file sets the base
# theme for chrome that Streamlit does not expose to CSS overrides; the
# injected stylesheet in web/app.py handles everything else.
base = "dark"
primaryColor = "#3FC1E0"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#121B2B"
textColor = "#EAF1FB"
font = "sans serif"

[browser]
gatherUsageStats = false
